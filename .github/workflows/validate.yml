name: Validate collection

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/quality.txt
      - run: python -m pip install -r requirements/quality.txt
      - run: ruff check scripts tests
      - run: ruff format --check scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repository.py

  companions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/companions.txt
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/companions.txt
      - run: python scripts/run_companions.py
      - run: python scripts/check_repository.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: companion-execution
          path: |
            reports/companion-execution.json
            companions/*.ipynb
